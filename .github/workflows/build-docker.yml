name: Docker Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches: [main, master, dev]
    paths:
      - 'api/src/**'
      - 'api/package.json'
      - 'api/Dockerfile'
      - 'api/.dockerignore'
      - 'yarn.lock'
      - 'package.json'
  push:
    branches: [main, master, dev]
    paths:
      - 'api/src/**'
      - 'api/package.json'
      - 'api/Dockerfile'
      - 'api/.dockerignore'
      - 'yarn.lock'
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Check for Dockerfile
        id: dockerfile
        run: echo "exists=$([ -f api/Dockerfile ] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build Docker image
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: api
          file: api/Dockerfile
          push: false
          load: true
          tags: synti-iq-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Skip (no Dockerfile)
        if: steps.dockerfile.outputs.exists != 'true'
        run: echo "Dockerfile not found — skipping Docker build. Add api/Dockerfile to enable this check."
