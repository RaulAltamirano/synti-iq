name: Docker Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches: [main, master, dev]
    paths:
      - 'src/**'
      - 'package.json'
      - 'yarn.lock'
      - 'Dockerfile'
      - '.dockerignore'
  push:
    branches: [main, master, dev]
    paths:
      - 'src/**'
      - 'package.json'
      - 'yarn.lock'
      - 'Dockerfile'
      - '.dockerignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Check for Dockerfile
        id: dockerfile
        run: echo "exists=$([ -f Dockerfile ] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Build Docker image
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          push: false
          load: true
          tags: synti-iq-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Skip (no Dockerfile)
        if: steps.dockerfile.outputs.exists != 'true'
        run: echo "Dockerfile not found — skipping Docker build. Add Dockerfile to enable this check."
